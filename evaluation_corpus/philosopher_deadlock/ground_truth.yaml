model_id: philosopher_deadlock
description: >
  Variant of dining_philosophers_a.prism with an asymmetric bug.
  In dining_philosophers_a, ALL philosophers are symmetric (none check
  the right fork) → symmetric deadlock, equal responsibility.
  Here, P2 and P3 are FIXED (check right fork before grabbing left fork)
  but P1 is LEFT UNFIXED → only P1 can initiate circular wait.
  Same variable structure as dining_philosophers_a (p1l, p1r, f1 bools).

bug_location:
  module: P1
  transition: "[TakeF1P1] !p1l -> (p1l'= true)"
  line_description: "P1's left-fork grab — missing '& f2' guard"
  component: guard_condition
  specific_element: "Missing '& f2' (right fork available) check in TakeF1P1 guard"

bug_type: missing_guard
severity: high

property_violated: "P=? [ F \"sbad\" ]"
violation_details:
  expected_value: 0.0
  actual_value: ">0.0"
  explanation: >
    Deadlock state (all forks taken, no one eating) is reachable because
    P1 can grab F1 even when F2 is not available, enabling circular wait.

expected_responsibility:
  description: >
    P1's states should carry higher responsibility than P2/P3 because
    the bug is localized in P1's module. Under pessimistic scheduler
    assumptions, the asymmetry should be more pronounced.
  notes: >
    Compare with dining_philosophers_a where responsibility is equal
    (0.333 each) because ALL philosophers are symmetric. In THIS model,
    only P1 is unfixed, so P1's states should dominate.

repair:
  description: "Add '& f2' guard to P1's TakeF1P1 transition"
  change_from: "[TakeF1P1] !p1l -> (p1l'= true);"
  change_to: "[TakeF1P1] !p1l & f2 -> (p1l'= true);"
  verification: >
    After applying the fix, P=? [ F "sbad" ] should return 0.0.
    The correct version is in correct.prism.

test_status: ready
notes: >
  Based on the Zenodo dining_philosophers_a benchmark with the same
  variable structure (p1l/p1r/e1 bools, fork modules). The asymmetric
  bug makes it ideal for demonstrating the debugging workflow:
  property violated → responsibility flags P1 → find missing guard → fix.
